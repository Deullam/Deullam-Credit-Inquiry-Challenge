name: credit-inquiry

services:
  deullam.credit.inquiry.challenge.api:
    image: ${DOCKER_REGISTRY-}deullamcreditinquirychallengeapi
    restart: unless-stopped
    build:
      context: .
      dockerfile: Deullam.Credit.Inquiry.Challenge.API/Dockerfile
    container_name: credit-inquiry-Api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Só HTTP no compose: com https://+:8081 o Kestrel exige um certificado de desenvolvimento
      # (montado só no Windows pelo docker-compose.override.yml); sem ele a API não sobe, e com ele
      # o UseHttpsRedirection devolve 307 para as URLs http documentadas no README.
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - ConnectionStrings__Kafka=${KAFKA_CONNECTION_STRING}

    depends_on:
      postgres-db:
          condition: service_healthy
      kafka:
          condition: service_started


  postgres-db:
    image: postgres:15-alpine
    container_name: credit-inquiry-db
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - credit_inquiry_postgres_data:/var/lib/postgresql/data
    healthcheck:
       test: pg_isready -U ${DB_USER} -d ${DB_NAME}
       interval: 10s
       timeout: 5s
       retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: credit-inquiry-PgAdmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 443
    ports:
      - "82:80"
      - "443:443"
    depends_on:
      - postgres-db
    volumes:
      - credit_inquiry_pgadmin_data:/var/lib/pgadmin
 
  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.0.1
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0


volumes:
  credit_inquiry_postgres_data:
    driver: local
  credit_inquiry_pgadmin_data:
    driver: local
